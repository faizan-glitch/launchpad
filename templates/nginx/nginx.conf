# Nginx production virtual host template
#
# Replace `example.com` and the upstream address to match your app.
# Ensure Nginx 1.25.0+ is installed for QUIC/HTTP3 support.

# Rate limiting zone (define in http block if separate)
limit_req_zone $binary_remote_addr zone=one:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name {{domain}};
    server_tokens off;

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Listen on 443 for TCP (HTTPS/HTTP2) and UDP (QUIC/HTTP3)
    listen 443 ssl;
    http2 on;
    # listen [::]:443 ssl;

    server_name {{domain}};
    server_tokens off;

    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/{{domain}}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{domain}}/privkey.pem;

    # HTTP/3 specific headers
    add_header Alt-Svc 'h3=":443"; ma=86400';

    # Recommended SSL settings (TLS 1.3 required for HTTP/3)
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        # Rate limiting
        limit_req zone=one burst=20 nodelay;

        proxy_pass http://127.0.0.1:3000;

        # Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts and Buffer settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
